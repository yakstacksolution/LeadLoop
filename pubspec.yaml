name: futsal_lead
description: "Hamro Futsal — internal lead & venue follow-up management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  cloud_functions: ^6.0.2
  firebase_messaging: ^16.0.2

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # DI & routing
  get_it: ^8.2.0
  go_router: ^16.2.1

  # Utilities
  intl: ^0.20.2
  geolocator: ^14.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  syncfusion_flutter_charts: ^34.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/

# Launcher icon, generated into the native projects with
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  # The padded copies, generated from assets/futsal_lead.png — the artwork
  # sits inside a margin instead of running to the edge of the icon.
  image_path: assets/generated/launcher_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  # Adaptive icon: Android masks the foreground to whatever shape the launcher
  # uses, so the artwork is padded onto a white plate rather than cropped.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/generated/launcher_foreground.png
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#F27819"

